name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    - cron: "3,23,43 * * * *"
    # GitHub drops many scheduled runs on forks; a second line raises the odds one fires.
    - cron: "13,33,53 * * * *" # every 20 min, offset off the hour. Make sure to skip already-forecasted questions!

permissions:
  contents: write

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        run: |
          uv run python main.py
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Save the spending ledger
        if: always()
        run: |
          git config user.name "metaculus-bot"
          git config user.email "metaculus-bot@users.noreply.github.com"
          git add spend_ledger.json
          git diff --cached --quiet || git commit -m "Update spending ledger"
          git pull --rebase -q origin main || true
          git push -q origin HEAD:main
